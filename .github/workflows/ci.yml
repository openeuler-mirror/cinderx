name: CI

on: [push, pull_request]

jobs:
  run_tests:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let test failures on one platform block other platforms.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        # Test against multiple patch versions as CinderX references internal
        # CPython functions and structures which can lead to ABI problems.  See
        # cinderx/UpstreamBorrow for more details.
        python-version: ['3.14.0', '3.14.1', '3.14.2', '3.14.3', '3.14.4']

    steps:
    - name: Checkout CinderX
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Create venv
      run: uv venv --python ${{ matrix.python-version }}

    - name: Build CinderX
      run: uv build --wheel --python ${{ matrix.python-version }}

    - name: Install CinderX
      run: uv pip install cinderx --find-links dist --no-index

    - name: Check CinderX loads successfully
      if: runner.os != 'Windows'
      run: |
        uv run python -c 'import cinderx ; print(cinderx.get_import_error()) ; assert cinderx.is_initialized()'

    - name: Install pytest
      if: runner.os != 'Windows'
      run: uv pip install pytest

    - name: Run Tests
      if: runner.os != 'Windows'
      run: uv run pytest cinderx/PythonLib/test_cinderx/test*.py

  # INFRA-2: no-behavior-drift gate for Compiler::runPasses.  Anchored to
  # the supported platform and a single line per the version policy
  # (Linux aarch64 per README_CN, Python 3.14 — matching the committed
  # goldens); x86_64 and other Python versions keep extension capability
  # only and are deliberately not gated here.
  hir_pipeline_golden:
    name: HIR pipeline golden gate (3.14)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout CinderX
        uses: actions/checkout@v6

      - name: Set up Python 3.14.3
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'

      - name: Configure runtime_tests
        run: >
          cmake -S . -B build/rt -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DENABLE_RUNTIME_TESTS=ON -DPY_VERSION=3.14
          -DPython_ROOT_DIR=$(python -c "import sys; print(sys.prefix)")
          -DPython_EXECUTABLE=$(which python)
          -DMETA_PYTHON=0 -DENABLE_ADAPTIVE_STATIC_PYTHON=0
          -DENABLE_DISASSEMBLER=1 -DENABLE_ELF_READER=1
          -DENABLE_INTERPRETER_LOOP=1 -DENABLE_LIGHTWEIGHT_FRAMES=1
          -DENABLE_PEP523_HOOK=1 -DENABLE_SYMBOLIZER=1 -DENABLE_USDT=1
          -DENABLE_XXCLASSLOADER=1 -DENABLE_ZLIB=1

      - name: Build runtime_tests
        run: cmake --build build/rt --target runtime_tests --parallel "$(nproc)"

      - name: Run HIR pipeline golden suite
        run: >
          ./build/rt/cinderx/RuntimeTests/runtime_tests
          --gtest_filter=HIRPipelineGolden.*

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let build failures on one platform block other platforms.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout CinderX
        uses: actions/checkout@v6

      # cibuildwheel uses Python from a docker container.  The Python version is
      # controlled by selecting the docker image version in pyproject.toml.
      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CinderX
        uses: actions/checkout@v6

      # An sdist is just source code and doesn't contain compiled artifacts, it
      # doesn't need to be built per patch version.
      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Install build tools
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist
