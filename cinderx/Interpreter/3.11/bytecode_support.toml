# CPython 3.11 bytecode support list.
#
# Single fact source for how the 3.11 JIT front end treats every opcode the
# anchored interpreter defines.  Consumers: the front end's eligibility
# pre-scan and normalization tables (which must be generated from or verified
# against this file), the opcode coverage reporter, and the CI consistency
# gate (ci_pipeline/check_bytecode_support_311.py).  Rows change only
# together with the translator work that justifies them.
#
# States:
#   translate        the translator carries the full 3.11 semantics of the
#                    opcode: exceptions, eval-breaker obligations and deopt
#                    sites included.
#   normalize        a quickened form (adaptive family, specialized variant
#                    or superinstruction).  The instruction decoder rewrites
#                    it to `to` before translation; `cache` records the
#                    inline-cache slots that follow it in the stream.
#   refuse           deliberately not compiled: hitting it refuses the whole
#                    code object with `reason` before any JIT state exists.
#   interpreter-only never reaches the translator at all: the opcode occurs
#                    only in code shapes eligibility refuses wholesale
#                    (async code, module/class/REPL bodies) or in dispatch
#                    pseudo-slots that never appear in co_code.
#
# Refusal reasons below are stable identifiers, extended only with review.
# Opcode reasons apply to individual rows.  Shape reasons reject an entire
# code object during eligibility and therefore never appear on opcode rows.
#
# Provenance: opcode numbers, cache widths and specialization families come
# from the anchored openEuler python3-3.11.6 opcode tables, cross-checked
# against the vendored pristine upstream/opcode_targets.h; the initial
# translate/refuse split was extracted from the dryrun reference translator
# (dryrun-311-base @ a6648617, isSupportedOpcode evaluated for a 3.11
# build) and then hand-reviewed.  Planned columns not yet recorded here
# (stack effects, may-raise, eval-breaker obligation, corpus references)
# land with the 3.11 front end change that consumes them.

[meta]
python = "3.11.6"
slots = 256

[refusal_reasons.opcode]
REFUSE_PATTERN_MATCHING_UNAUDITED = "MATCH_* helper and protocol audit pending"
REFUSE_EXCEPT_STAR_UNAUDITED = "except* translation audit pending"
REFUSE_HELPER_UNAVAILABLE_PRE314 = "required CPython helper is unavailable before 3.14"
REFUSE_UNPORTED = "opcode has no audited 3.11 translation"
INTERP_ONLY_ASYNC_CODE = "opcode occurs only in async code rejected by eligibility"
INTERP_ONLY_NON_FUNCTION_SCOPE = "opcode occurs only in module, class, or REPL code"
INTERP_ONLY_PSEUDO_SLOT = "dispatch slot is never emitted into co_code"

[refusal_reasons.shape]
REFUSE_SHAPE_GENERATOR_RUNTIME_UNAUDITED = "generator runtime and suspension semantics are deferred to MR-10"
REFUSE_SHAPE_ASYNC_CODE = "coroutine and async-generator execution is not eligible"
REFUSE_SHAPE_NON_FUNCTION_SCOPE = "module, class, and REPL code is not eligible"
REFUSE_SHAPE_NAMESPACE_UNSUPPORTED = "function globals or builtins namespace cannot be safely preloaded"
REFUSE_SHAPE_INT_ACCUMULATOR_POLICY = "integer constant-accumulator shapes outside the audited compact add/subtract path are excluded from MR-03"
REFUSE_SHAPE_JIT_SUPPRESSED = "the code object explicitly suppresses JIT compilation"
REFUSE_SHAPE_FRONTEND_POLICY = "the code object uses a front-end policy pattern that is not eligible for shadow compilation"
REFUSE_SHAPE_CODEGEN_SPAN = "shadow AArch64 relocation cannot encode the generated span (pathological EXTENDED_ARG tests, or RelocOffsetOutOfRange)"
REFUSE_SHAPE_STATIC_RUNTIME_CACHE = "shadow codegen cannot retain the runtime cache required by a static invoke"
REFUSE_SHAPE_INVALID_UTF8_NAME = "co_names contains a string that is not valid UTF-8, so eligibility cannot read it"
REFUSE_SHAPE_EXECUTE_SURFACE = "the code object uses instructions outside the machine-code execution whitelist"
REFUSE_SHAPE_VARIADIC_ARGS_UNAUDITED = "retired: generated prologue binds *args and **kwargs (kept for observe id stability)"
REFUSE_SHAPE_KEYWORD_ARGS_UNAUDITED = "retired: generated prologue binds keyword-only parameters (kept for observe id stability)"
REFUSE_SHAPE_ARG_DEFAULTS_UNAUDITED = "retired: generated prologue rebinds live defaults (kept for observe id stability)"
REFUSE_SHAPE_SPECULATIVE_GUARD = "the optimized artifact holds a DeoptPatchpoint; IC patchpoints stay refused until MR-09"
REFUSE_SHAPE_CODE_ARTIFACT_ALREADY_PUBLISHED = "the code object already has a published compiled artifact owned by another function; one artifact per code object until the MR-05 lifecycle"
REFUSE_SHAPE_SHARED_ARTIFACT_LIFECYCLE = "a compiled artifact already belongs to another function; sharing needs the MR-05 function-destroy notification"
REFUSE_SHAPE_IMPORTLIB_BOOTSTRAP = "import machinery is kept interpreted on 3.11; compiling it taxes startup and is not a steady-state win"
REFUSE_SHAPE_CINDER_MODULE = "compiling cinderx keeps the extension module alive past finalize"

