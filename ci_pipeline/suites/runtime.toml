fail_fast = true

# This suite runs the full runtime_tests binary, which includes the
# HIRPipelineGolden suite (RuntimeTests/hir_pipeline_test.cpp): the
# no-behavior-drift gate for Compiler::runPasses.  Goldens are anchored
# per (python, arch); on a target with no committed goldens the suite
# skips loudly instead of failing (see
# RuntimeTests/hir_pipeline_golden/README.md for the version policy:
# gates anchor 3.14 only, other versions keep extension capability).

[target]
python = "3.14"
arch = "arm64"
system = "Linux"

[[jobs]]
name = "runtime_tests"
kind = "runtime_tests"
coverage = true
[jobs.env]
CINDERX_RUNTIME_TEST_LIGHTWEIGHT_REGEX = "CmdLineTest.LightweightFrame|ReifyFrameTest|Deopt"
CINDERX_RUNTIME_TEST_SPLIT_LWF_OSR = "1"
ENABLE_LIGHTWEIGHT_FRAMES = "1"
ENABLE_XXCLASSLOADER = "1"
