# CPython 3.11 PR acceptance gate.  The unified ``pr`` entry point selects
# this suite when it is run by Python 3.11.

fail_fast = true

[target]
python = "3.11"
arch = "arm64"
system = "Linux"

# Validate the vendored CPython manifest before compiling one Release
# RuntimeTests binary.  Census, Green and Canary all consume that binary.
# Jenkins supplies RT311_BASELINE_BASE for PR self-extension checks; Daily
# runs the census against the already-reviewed manifests without that input.
[[jobs]]
name = "runtime_tests_311"
phase = "runtime_tests"
command = "bash -lc 'cd cinderx/Interpreter/3.11/upstream && sha256sum --check --quiet SHA256SUMS && cd ../../../.. && ci_pipeline/scripts/run_rt311_green.sh \"{run_dir}/rt311-build\" --census'"

# PR builds one Release wheel.  Daily verifies an optional CINDERX_TEST_WHEEL
# or builds the normalized Release wheel itself.  Both paths provision the
# same candidate venv and finish with import and dynamic-symbol smoke checks.
[[jobs]]
name = "setup_release_311"
phase = "setup_release"
command = "bash -lc 'bash ci_pipeline/scripts/run_cp311_stage.sh setup_release \"{run_dir}\"'"

# Fast PR functional gate: Kunpeng tests, generator/refcount matrices,
# bytecode support, evaluator/observe/execute, lifecycle and non-Lib/test
# JIT drivers.
[[jobs]]
name = "test_release_311"
phase = "test_release"
command = "bash -lc 'bash ci_pipeline/scripts/run_cp311_stage.sh test_release \"{run_dir}\"'"

# Optional PR Lib/test validation.  The self-contained execute gate runs its
# own stock 72 control before the execute 72 arm.
[[jobs]]
name = "libtest_execute_72_311"
phase = "libtest"
enabled_by_env = "CINDERX_LOCAL_RUN_LIBTEST"
command = "bash -lc 'bash ci_pipeline/scripts/run_cp311_stage.sh libtest_execute_72 \"{run_dir}\"'"

# Reuse the same opt-in for the ten-module Py_DEBUG reference-leak gate.  The
# refleak runner owns and caches its debug interpreter and debug-ABI wheel.
[[jobs]]
name = "pydebug_refleak_10_311"
phase = "libtest"
enabled_by_env = "CINDERX_LOCAL_RUN_LIBTEST"
command = "bash -lc 'ci_pipeline/scripts/run_refleak_311.sh \"{run_dir}/refleak\"'"
