[meta]
version = 1
python = "3.11.6"

# Stable capability decisions.  Compiler failures and transient states not
# listed here remain unexpected and fail the execution acceptance classifier.
[expected_refusal]
reasons = [
  "REFUSE_PATTERN_MATCHING_UNAUDITED",
  "REFUSE_EXCEPT_STAR_UNAUDITED",
  "REFUSE_HELPER_UNAVAILABLE_PRE314",
  "REFUSE_UNPORTED",
  "INTERP_ONLY_ASYNC_CODE",
  "INTERP_ONLY_NON_FUNCTION_SCOPE",
  "INTERP_ONLY_PSEUDO_SLOT",
  "REFUSE_SHAPE_GENERATOR_RUNTIME_UNAUDITED",
  "REFUSE_SHAPE_ASYNC_CODE",
  "REFUSE_SHAPE_NON_FUNCTION_SCOPE",
  "REFUSE_SHAPE_NAMESPACE_UNSUPPORTED",
  "REFUSE_SHAPE_INT_ACCUMULATOR_POLICY",
  "REFUSE_SHAPE_JIT_SUPPRESSED",
  "REFUSE_SHAPE_FRONTEND_POLICY",
  "REFUSE_SHAPE_CODEGEN_SPAN",
  "REFUSE_SHAPE_STATIC_RUNTIME_CACHE",
  "REFUSE_SHAPE_INVALID_UTF8_NAME",
  "REFUSE_SHAPE_IMPORTLIB_BOOTSTRAP",
  "REFUSE_SHAPE_CINDER_MODULE",
]

[runtime_fallback]
reasons = [
  "TRACING_ACTIVE",
  "PROFILING_ACTIVE",
  "FOREIGN_EVALUATOR",
  "JIT_PAUSED",
]

# Exact audited machine-code whitelist. The hook reads the runtime's list from
# cinderjit and the classifier requires set equality before accepting any
# REFUSE_SHAPE_EXECUTE_SURFACE result.
[execute_surface]
supported_opcodes = [
  "BEFORE_WITH",
  "BINARY_OP",
  "BUILD_CONST_KEY_MAP",
  "BUILD_LIST",
  "BUILD_MAP",
  "BUILD_SET",
  "BUILD_TUPLE",
  "CALL",
  "CALL_FUNCTION_EX",
  "CHECK_EXC_MATCH",
  "COMPARE_OP",
  "CONTAINS_OP",
  "COPY",
  "COPY_FREE_VARS",
  "DELETE_FAST",
  "DICT_MERGE",
  "DICT_UPDATE",
  "EXTENDED_ARG",
  "FOR_ITER",
  "GET_ITER",
  "GET_YIELD_FROM_ITER",
  "IS_OP",
  "JUMP_BACKWARD",
  "JUMP_BACKWARD_NO_INTERRUPT",
  "JUMP_FORWARD",
  "KW_NAMES",
  "LIST_APPEND",
  "LIST_EXTEND",
  "LIST_TO_TUPLE",
  "LOAD_ASSERTION_ERROR",
  "LOAD_ATTR",
  "LOAD_CLOSURE",
  "LOAD_CONST",
  "LOAD_DEREF",
  "LOAD_FAST",
  "LOAD_GLOBAL",
  "LOAD_METHOD",
  "MAKE_CELL",
  "MAKE_FUNCTION",
  "MAP_ADD",
  "NOP",
  "POP_JUMP_BACKWARD_IF_FALSE",
  "POP_JUMP_BACKWARD_IF_NONE",
  "POP_JUMP_BACKWARD_IF_NOT_NONE",
  "POP_JUMP_BACKWARD_IF_TRUE",
  "POP_JUMP_FORWARD_IF_FALSE",
